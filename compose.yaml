services:
  codex-reset-watch:
    build: .
    restart: unless-stopped
    init: true
    environment:
      REDEEM_ENABLED: ${REDEEM_ENABLED:-false}
      REDEEM_BEFORE_MINUTES: ${REDEEM_BEFORE_MINUTES:-30}
      CHECK_INTERVAL_SECONDS: ${CHECK_INTERVAL_SECONDS:-60}
      DISPLAY_TIMEZONE: ${DISPLAY_TIMEZONE:-America/New_York}
    volumes:
      - codex-reset-data:/data
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  codex-reset-data:
